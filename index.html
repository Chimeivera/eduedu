<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>115年度 培訓計畫執行調查 · 評鑑量性指標達標儀表板</title>
<style>
  :root{
    --ink:#141a26; --ink2:#3d4657; --muted:#6b7688; --line:#e2e6ed;
    --bg:#eef1f5; --card:#ffffff; --accent:#2b6cb0; --accent-soft:#eaf1fa;
    --vs:#1f9d61; --s:#83c98d; --ok:#f3c14b; --ns:#ec8a56; --vns:#d9534f;
    --pass:#1f9d61; --passbg:#e7f6ee; --fail:#d9534f; --failbg:#fcecec;
    --shadow:0 1px 3px rgba(20,26,38,.07),0 6px 18px rgba(20,26,38,.05);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",system-ui,sans-serif;
    background:var(--bg);color:var(--ink);line-height:1.55;-webkit-font-smoothing:antialiased;
    padding:24px 16px 60px;}
  .wrap{max-width:1160px;margin:0 auto;}
  h1{font-size:1.6rem;font-weight:800;letter-spacing:.5px;}
  .sub{color:var(--muted);font-size:.92rem;margin-top:4px;}
  .trial-tag{display:inline-block;vertical-align:middle;font-size:.72rem;font-weight:800;color:#8a6d00;
    background:#fff3cf;border:1px solid #f0e3b0;border-radius:999px;padding:2px 12px;margin-left:8px;letter-spacing:1px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);}
  section{margin-top:22px;}
  .sec-title{font-size:1.12rem;font-weight:800;display:flex;align-items:center;gap:9px;margin-bottom:12px;}
  .sec-title .bar{width:5px;height:20px;background:var(--accent);border-radius:3px;}
  .note{font-size:.86rem;color:var(--ink2);background:var(--accent-soft);border:1px solid #d6e4f5;
    border-radius:10px;padding:10px 14px;margin-bottom:16px;}
  .note b{color:var(--accent);}

  /* per-indicator conclusion bar */
  .concl{border:1px solid var(--line);border-radius:16px;padding:14px 18px;margin-bottom:16px;background:#fbfcfe;}
  .concl-row{display:flex;flex-wrap:wrap;gap:12px;}
  .concl-item{flex:1 1 300px;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:12px;border:1px solid;}
  .concl-item.ok{background:var(--passbg);border-color:#bfe6cf;}
  .concl-item.warn{background:#fffdf2;border-color:#f0e3b0;}
  .concl-item .ico{font-size:1.4rem;font-weight:800;}
  .concl-item.ok .ico{color:var(--pass);}
  .concl-item.warn .ico{color:#b58900;}
  .concl-item .code{font-size:.82rem;font-weight:800;color:var(--muted);}
  .concl-item .stat{font-size:1rem;font-weight:800;}
  .concl-item.ok .stat{color:var(--pass);}
  .concl-item.warn .stat{color:var(--warn,#8a6d00);}
  .concl-item .sc{margin-left:auto;font-size:1.5rem;font-weight:800;white-space:nowrap;}
  .concl-item.ok .sc{color:var(--pass);}
  .concl-item.warn .sc{color:#b58900;}
  .concl-item .sc small{font-size:.72rem;color:var(--muted);font-weight:700;display:block;text-align:right;}
  .concl-note{font-size:.8rem;color:var(--muted);margin-top:10px;}
  /* attention card */
  .attention{padding:15px 18px;margin-bottom:18px;border:1px solid #f0d9a8;background:#fffaf0;border-radius:14px;}
  .attention h4{font-size:.98rem;font-weight:800;color:#9a6b00;margin-bottom:9px;}
  .att-row{display:flex;align-items:center;gap:10px;padding:5px 0;font-size:.9rem;}
  .att-row .pctb{flex:none;font-weight:800;min-width:56px;text-align:center;border-radius:7px;padding:2px 6px;font-size:.85rem;}
  .att-row .qn{color:var(--ink2);}
  /* qualitative */
  .qual .qitem{padding:9px 12px;margin:8px 0;border-left:3px solid var(--accent);background:#f7f9fc;border-radius:0 8px 8px 0;font-size:.9rem;color:var(--ink);}
  .qual .qitem .who{font-size:.78rem;color:var(--muted);font-weight:700;margin-right:6px;}
  .qual .empty{font-size:.9rem;color:var(--muted);padding:10px 2px;}
  /* accreditation cards */
  .acc-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  @media(max-width:820px){.acc-grid{grid-template-columns:1fr;}}
  .acc{padding:20px 22px;position:relative;overflow:hidden;}
  .acc .tag{font-size:.8rem;color:var(--muted);font-weight:700;}
  .acc h3{font-size:1.14rem;font-weight:800;margin:2px 0 2px;}
  .acc .src{font-size:.8rem;color:var(--muted);margin-bottom:16px;}
  .metric-row{display:flex;gap:16px;}
  .metric{flex:1;text-align:center;}
  .gauge{position:relative;width:118px;height:118px;margin:0 auto 4px;}
  .gauge .val{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;}
  .gauge .num{font-size:1.5rem;font-weight:800;line-height:1;}
  .gauge .thr{font-size:.72rem;color:var(--muted);margin-top:3px;}
  .metric .lbl{font-size:.9rem;font-weight:700;margin-top:2px;}
  .metric .det{font-size:.78rem;color:var(--muted);}
  .badge{display:inline-flex;align-items:center;gap:5px;font-size:.78rem;font-weight:800;
    padding:3px 10px;border-radius:999px;margin-top:5px;}
  .b-pass{color:var(--pass);background:var(--passbg);}
  .b-fail{color:var(--fail);background:var(--failbg);}
  .verdict{margin-top:16px;padding:12px 14px;border-radius:12px;font-weight:800;display:flex;
    align-items:center;justify-content:space-between;font-size:.95rem;}
  .v-pass{background:var(--passbg);color:var(--pass);border:1px solid #bfe6cf;}
  .v-fail{background:var(--failbg);color:var(--fail);border:1px solid #f3c9c9;}
  .verdict .score{font-size:.82rem;font-weight:700;}

  /* action panel */
  .action{margin-top:18px;padding:18px 22px;border:1px solid #f3c9c9;background:#fdf5f5;border-radius:16px;}
  .action h4{font-size:1.02rem;font-weight:800;color:var(--fail);display:flex;align-items:center;gap:8px;}
  .action.rr-ok{border:1px solid #bfe6cf;background:#f2fbf6;}
  .action p{font-size:.9rem;color:var(--ink2);margin-top:6px;}
  .action .big{font-weight:800;color:var(--fail);}
  .gap-tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:.86rem;}
  .gap-tbl th,.gap-tbl td{padding:7px 10px;border-bottom:1px solid #eee;text-align:center;}
  .gap-tbl th{background:#fff;color:var(--muted);font-weight:700;}
  .gap-tbl td:first-child,.gap-tbl th:first-child{text-align:left;}
  .miss{color:var(--fail);font-weight:800;}

  /* tabs */
  .tabs{display:inline-flex;background:#e3e8ef;border-radius:12px;padding:4px;margin:6px 0 4px;}
  .tabs button{border:none;background:transparent;font:inherit;font-weight:700;font-size:.95rem;
    padding:8px 22px;border-radius:9px;cursor:pointer;color:var(--ink2);transition:.15s;}
  .tabs button.on{background:#fff;color:var(--accent);box-shadow:var(--shadow);}

  /* kpi */
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  @media(max-width:820px){.kpis{grid-template-columns:1fr 1fr;}}
  .kpi{padding:16px 18px;text-align:center;}
  .kpi .n{font-size:1.7rem;font-weight:800;}
  .kpi .k{font-size:.85rem;color:var(--muted);margin-top:2px;}
  .kpi.hl .n{color:var(--accent);}

  .two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;}
  @media(max-width:820px){.two{grid-template-columns:1fr;}}
  .panel{padding:18px 20px;}
  .panel h4{font-size:1rem;font-weight:800;margin-bottom:12px;}

  /* dimension band */
  .dim{margin-bottom:11px;}
  .dim .top{display:flex;justify-content:space-between;font-size:.9rem;font-weight:700;margin-bottom:4px;}
  .dim .track{height:14px;background:#eef1f5;border-radius:7px;overflow:hidden;position:relative;}
  .dim .fill{height:100%;border-radius:7px;background:linear-gradient(90deg,var(--s),var(--vs));}
  .dim .thrline{position:absolute;top:-3px;bottom:-3px;left:80%;width:2px;background:var(--fail);opacity:.55;}

  /* per-question */
  .q{padding:9px 0;border-bottom:1px solid var(--line);}
  .q:last-child{border-bottom:none;}
  .q .qtop{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;margin-bottom:5px;}
  .q .qtxt{color:var(--ink2);}
  .q .qsat{font-weight:800;white-space:nowrap;}
  .stack{display:flex;height:11px;border-radius:6px;overflow:hidden;background:#eef1f5;}
  .stack span{display:block;height:100%;}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:.8rem;color:var(--ink2);margin:2px 0 14px;}
  .legend i{display:inline-block;width:11px;height:11px;border-radius:3px;margin-right:5px;vertical-align:-1px;}

  /* job category */
  .jc{margin-bottom:10px;}
  .jc .jtop{display:flex;justify-content:space-between;font-size:.88rem;margin-bottom:4px;}
  .jc .jname{font-weight:700;}
  .jc .jrate{font-weight:800;}
  .jc .track{height:13px;background:#eef1f5;border-radius:7px;overflow:hidden;position:relative;}
  .jc .fill{height:100%;border-radius:7px;}
  .jc .thrline{position:absolute;top:-3px;bottom:-3px;left:70%;width:2px;background:#334;opacity:.45;}
  .foot{color:var(--muted);font-size:.78rem;text-align:center;margin-top:30px;}
  /* detail table */
  .detail-meta{font-size:.86rem;color:var(--muted);margin-bottom:12px;}
  .detail-sum{display:flex;flex-wrap:wrap;align-items:center;gap:10px 20px;
    background:var(--accent-soft);border:1px solid #d6e4f5;border-radius:12px;padding:12px 16px;margin-bottom:12px;}
  .detail-sum .big{font-size:1.05rem;font-weight:800;color:var(--ink);}
  .detail-sum .big b{color:var(--accent);}
  .detail-sum .rr{font-weight:800;}
  .cat-chips{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px;}
  .cat-chips .chip{font-size:.8rem;font-weight:700;padding:5px 12px;border-radius:999px;
    border:1px solid var(--line);background:#fff;color:var(--ink2);cursor:pointer;transition:.12s;user-select:none;}
  .cat-chips .chip:hover{border-color:var(--accent);background:var(--accent-soft);}
  .cat-chips .chip b{color:var(--accent);}
  .cat-chips .chip.low b{color:var(--fail);}
  .cat-chips .chip.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .cat-chips .chip.active b{color:#fff;}
  .cat-chips .chip.allc{font-weight:800;}
  .detail-count{font-size:.82rem;color:var(--ink2);margin-bottom:10px;}
  .detail-count b{color:var(--accent);}
  .detail-legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.8rem;color:var(--ink2);margin-bottom:12px;}
  .detail-legend span{display:inline-flex;align-items:center;gap:5px;}
  .detail-legend i{display:inline-block;width:22px;height:16px;border-radius:4px;text-align:center;
    font-size:.72rem;font-weight:800;line-height:16px;}
  .detail-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:12px;}
  .detail-tbl{border-collapse:separate;border-spacing:0;font-size:.8rem;white-space:nowrap;}
  .detail-tbl th,.detail-tbl td{padding:5px 7px;text-align:center;border-bottom:1px solid var(--line);border-right:1px solid #f0f2f6;}
  .detail-tbl thead th{position:sticky;top:0;z-index:3;background:var(--accent);color:#fff;font-weight:700;
    cursor:help;padding:7px 8px;}
  .detail-tbl td.cell{font-weight:800;min-width:30px;}
  .detail-tbl th.sticky,.detail-tbl td.sticky{position:sticky;left:0;z-index:2;background:#f7f9fc;
    border-right:1px solid var(--line);font-weight:700;color:var(--ink2);}
  .detail-tbl thead th.sticky{z-index:4;background:#245a97;}
  .detail-tbl td.catcol{background:#f7f9fc;font-weight:700;color:var(--ink2);white-space:nowrap;}
  .detail-tbl td.timecol{color:var(--muted);font-weight:500;white-space:nowrap;}
  .detail-tbl td.textcol{white-space:normal;min-width:220px;max-width:320px;text-align:left;color:var(--ink2);}
  .detail-tbl tbody tr:hover td:not(.cell){background:#eef3fa;}
  /* rules table */
  .rule-tbl{width:100%;border-collapse:collapse;font-size:.9rem;margin-top:4px;}
  .rule-tbl th{background:var(--accent);color:#fff;padding:11px 12px;font-weight:800;text-align:center;}
  .rule-tbl td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle;}
  .rule-tbl .code{font-weight:800;color:var(--ink);white-space:nowrap;}
  .rule-tbl .thr{color:var(--accent);font-weight:700;white-space:nowrap;text-align:center;}
  .rule-tbl .sc{text-align:center;font-weight:800;font-size:1.05rem;width:64px;}
  .rule-tbl .total td{background:#f2f5f9;font-weight:800;font-size:1.02rem;text-align:center;}
  .rule-tbl tr.mine{background:#eaf1fa;}
  .rule-tbl tr.mine .code{color:var(--accent);}
  .st-pill{display:inline-block;font-size:.74rem;font-weight:800;padding:2px 9px;border-radius:999px;margin-left:6px;}
  .st-pass{color:var(--pass);background:var(--passbg);}
  .st-fail{color:var(--fail);background:var(--failbg);}
  .rule-note{font-size:.85rem;color:var(--ink2);margin-top:14px;line-height:1.7;}
  .rule-note b{color:var(--accent);}
  .rule-principle{margin-top:14px;padding:14px 16px;background:#fffdf2;border:1px solid #f0e3b0;border-radius:12px;font-size:.88rem;line-height:1.75;color:var(--ink2);}
  .rule-principle b{color:#8a6d00;}
  .qtip{position:fixed;z-index:9999;display:none;pointer-events:none;max-width:380px;
    background:#141a26;color:#fff;font-size:1rem;line-height:1.55;font-weight:600;
    padding:11px 14px;border-radius:11px;box-shadow:0 8px 28px rgba(0,0,0,.28);white-space:normal;}
  .hide{display:none!important;}
  @media print{
    body{background:#fff;padding:0;}
    .tabs{display:none;}
    .tabpane{display:block!important;page-break-inside:avoid;}
    .card{box-shadow:none;}
    section{margin-top:14px;}
  }
</style>
</head>

<div class="wrap">
  <h1>115年度 臨床醫事人員培訓計畫 · 計畫執行調查　<span class="trial-tag">試填</span></h1>
  <div class="sub">評鑑量性指標達標儀表板（試填版）　｜　填答區間 114.09–115.06　｜　教學研究組</div>

  <!-- ===== 評鑑達標總覽 ===== -->
  <section>
    <div class="sec-title"><span class="bar"></span>評鑑量性指標 達標總覽</div>
    <div class="note">評分規則：醫院符合獎勵門檻後，量性指標<b>「達閾值即可得分」</b>。
      量性指標1、2 的閾值皆為 <b>滿意度 ≥ 80%</b> 且 <b>回收率 ≥ 70%</b>，各佔 <b>20 分</b>；
      兩條件須<b>同時</b>達標才計分。</div>
    <div id="scoreBanner"></div>
    <div class="acc-grid" id="accGrid"></div>
    <div id="rrStuPanel"></div>
    <div id="actionPanel"></div>
  </section>

  <!-- ===== 問卷細部 ===== -->
  <section>
    <div class="sec-title"><span class="bar"></span>問卷結果細部分析</div>
    <div class="tabs">
      <button id="tabStu" class="on" onclick="showTab('stu')">受訓人員（PGY學員）</button>
      <button id="tabStuRaw" onclick="showTab('sturaw')">受訓人員明細</button>
      <button id="tabTea" onclick="showTab('tea')">教師</button>
      <button id="tabTeaRaw" onclick="showTab('tearaw')">教師明細</button>
      <button id="tabRule" onclick="showTab('rule')">規範</button>
    </div>

    <div id="pane-stu" class="tabpane"></div>
    <div id="pane-sturaw" class="tabpane hide"></div>
    <div id="pane-tea" class="tabpane hide"></div>
    <div id="pane-tearaw" class="tabpane hide"></div>
    <div id="pane-rule" class="tabpane hide"></div>
  </section>

  <div class="foot">資料來源：Google 表單回覆彙整（教師滿意度 · PGY學員調查）｜滿意度＝（非常滿意＋滿意）÷ 填答人數｜本頁可離線瀏覽與列印張貼</div>
</div>

const pct = x => (x*100).toFixed(1)+'%';
const clr = ['var(--vs)','var(--s)','var(--ok)','var(--ns)','var(--vns)'];

/* ---------- accreditation config ---------- */
const IND = [
  {key:'pgy', code:'量性指標 1', title:'受訓人員計畫執行調查', src:'PGY學員問卷',
   sat:DATA.pgy.overall, rr:DATA.pgy.stu_rr._total, score:20},
  {key:'tea', code:'量性指標 2', title:'教師計畫執行調查', src:'教師問卷',
   sat:DATA.tea.overall, rr:DATA.tea.tea_rr._total, score:20},
];
const SAT_THR=0.80, RR_THR=0.70;

function gaugeSVG(value, thr, pass){
  const r=50, c=2*Math.PI*r, off=c*(1-Math.min(value,1));
  const col = pass ? 'var(--pass)' : 'var(--fail)';
  return `<svg viewBox="0 0 118 118" width="118" height="118">
    <circle cx="59" cy="59" r="${r}" fill="none" stroke="#eef1f5" stroke-width="12"/>
    <circle cx="59" cy="59" r="${r}" fill="none" stroke="${col}" stroke-width="12"
       stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${off}"
       transform="rotate(-90 59 59)"/>
  </svg>`;
}

function accCard(ind){
  const satPass = ind.sat>=SAT_THR, rrPass = ind.rr.rate>=RR_THR;
  const allPass = satPass && rrPass;
  const badge = ok => ok
    ? '<span class="badge b-pass">✓ 達標</span>'
    : '<span class="badge b-fail">✗ 未達</span>';
  return `<div class="card acc">
    <div class="tag">${ind.code}　·　${ind.score}分</div>
    <h3>${ind.title}</h3>
    <div class="src">資料來源：${ind.src}</div>
    <div class="metric-row">
      <div class="metric">
        <div class="gauge">${gaugeSVG(ind.sat,SAT_THR,satPass)}
          <div class="val"><div class="num">${pct(ind.sat)}</div><div class="thr">門檻 80%</div></div></div>
        <div class="lbl">滿意度</div>${badge(satPass)}
      </div>
      <div class="metric">
        <div class="gauge">${gaugeSVG(ind.rr.rate,RR_THR,rrPass)}
          <div class="val"><div class="num">${pct(ind.rr.rate)}</div><div class="thr">門檻 70%</div></div></div>
        <div class="lbl">回收率</div>
        <div class="det">${ind.rr.got} / ${ind.rr.req} 份</div>${badge(rrPass)}
      </div>
    </div>
    <div class="verdict ${allPass?'v-pass':'v-fail'}">
      <span>${allPass?'✓ 綜合達標':'✗ 綜合未達標'}</span>
      <span class="score">${allPass?('可得 '+ind.score+' 分'):('回收率不足 · '+ind.score+' 分待補件')}</span>
    </div>
  </div>`;
}
document.getElementById('accGrid').innerHTML = IND.map(accCard).join('');

/* ---- 分項得分結論（每項獨立達標、獨立計分，比照評分表）---- */
(function(){
  const item = ind => {
    const satOk=ind.sat>=SAT_THR, rrOk=ind.rr.rate>=RR_THR, ok=satOk&&rrOk;
    let stat, sc;
    if(ok){ stat='達標'; sc=`${ind.score}<small>／${ind.score} 分</small>`; }
    else if(satOk && !rrOk){
      const need=Math.max(0,Math.ceil(ind.rr.req*RR_THR)-ind.rr.got);
      stat=`未達（回收率 ${pct(ind.rr.rate)}）· 補 ${need} 份可得`; sc=`0<small>／${ind.score} 分</small>`;
    } else { stat='未達'; sc=`0<small>／${ind.score} 分</small>`; }
    const who = ind.key==='pgy' ? '受訓人員(學員)' : '教師';
    return `<div class="concl-item ${ok?'ok':'warn'}">
       <span class="ico">${ok?'✓':'⚠'}</span>
       <div><div class="code">${ind.code}　${who}</div><div class="stat">${stat}</div></div>
       <div class="sc">${sc}</div></div>`;
  };
  document.getElementById('scoreBanner').innerHTML = `
    <div class="concl">
      <div class="concl-row">${IND.map(item).join('')}</div>
      <div class="concl-note">※ 各指標獨立達閾值即計分（滿意度 ≥ 80% 且 回收率 ≥ 70%）。此為評分表 100 分中之 2 項，其餘由佐證一致性、量性指標9-B／13-C、質性指標1 等項目計分。</div>
    </div>`;
})();

/* ---------- 回收率明細表（學員＋教師一律顯示；達標綠、未達紅附補件） ---------- */
function rrPanel(rr, who, code){
  const t = rr._total;
  const pass = t.rate >= RR_THR;
  const cats = Object.entries(rr).filter(([k,v])=>k!=='_total' && typeof v.req==='number')
     .map(([k,v])=>({name:k, req:v.req, got:(typeof v.got==='number'?v.got:0),
                     rate:(typeof v.rate==='number'?v.rate:0)}));
  const rows = cats.map(o=>{
     const miss=o.req-o.got;
     return `<tr><td>${o.name}</td><td>${o.req}</td><td>${o.got}</td>
        <td class="${miss>0?'miss':''}">${miss>0?('缺 '+miss):'—'}</td>
        <td style="color:${o.rate>=RR_THR?'var(--pass)':'var(--fail)'};font-weight:800">${pct(o.rate)}</td></tr>`;
  }).join('');
  const need = Math.max(0, Math.ceil(t.req*RR_THR)-t.got);
  const head = pass
    ? `<h4 style="color:var(--pass)">✓ ${who}回收率明細（${code}）</h4>
       <p>回收 <b>${t.got} / ${t.req}</b> 份（<b style="color:var(--pass)">${pct(t.rate)}</b>），已達 70% 門檻、達標。</p>`
    : `<h4>⚠ ${who}回收率明細（${code}）· 未達門檻</h4>
       <p>回收 <b>${t.got} / ${t.req}</b> 份（<b class="big">${pct(t.rate)}</b>），未達 70% 門檻，尚需再補 <span class="big">${need} 份</span>即可達標。</p>`;
  return `<div class="action ${pass?'rr-ok':''}">
     ${head}
     <table class="gap-tbl">
       <tr><th>職類</th><th>應填</th><th>已填</th><th>未填</th><th>回收率</th></tr>
       ${rows}

/* ---------- radar ---------- */
function radarSVG(dims){
  const N=dims.length, cx=220, cy=158, R=104, base=0.75; // scale 75%~100%
  const ang = i => -Math.PI/2 + i*2*Math.PI/N;
  const rr = v => R*((v-base)/(1-base));
  let grid='';
  [0.25,0.5,0.75,1].forEach(g=>{
    let pts=dims.map((_,i)=>{const a=ang(i),r=R*g;return (cx+r*Math.cos(a))+','+(cy+r*Math.sin(a));}).join(' ');
    grid+=`<polygon points="${pts}" fill="none" stroke="#e2e6ed" stroke-width="1"/>`;
  });
  let axes='',labels='';
  dims.forEach((d,i)=>{
    const a=ang(i), x=cx+R*Math.cos(a), y=cy+R*Math.sin(a);
    axes+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="#e2e6ed"/>`;
    const co=Math.cos(a), si=Math.sin(a);
    const lx=cx+(R+16)*co, ly=cy+(R+16)*si;
    const anchor = Math.abs(co)<0.25?'middle':(co>0?'start':'end');
    const dy = si<-0.4?-3:(si>0.4?11:4);
    labels+=`<text x="${lx}" y="${ly+dy}" font-size="12" fill="var(--ink2)" font-weight="700"
       text-anchor="${anchor}" dominant-baseline="middle">${d.name}</text>
       <text x="${lx}" y="${ly+dy+14}" font-size="10.5" fill="var(--accent)" font-weight="700"
       text-anchor="${anchor}" dominant-baseline="middle">${(d.sat*100).toFixed(1)}%</text>`;
  });
  let dpts=dims.map((d,i)=>{const a=ang(i),r=Math.max(6,rr(d.sat));return (cx+r*Math.cos(a))+','+(cy+r*Math.sin(a));}).join(' ');
  let dots=dims.map((d,i)=>{const a=ang(i),r=Math.max(6,rr(d.sat));return `<circle cx="${cx+r*Math.cos(a)}" cy="${cy+r*Math.sin(a)}" r="3" fill="var(--accent)"/>`;}).join('');
  return `<svg viewBox="0 0 440 350" width="100%" style="max-width:440px;display:block;margin:0 auto">
    ${grid}${axes}
    <polygon points="${dpts}" fill="rgba(43,108,176,.16)" stroke="var(--accent)" stroke-width="2"/>
    ${dots}${labels}
    <text x="${cx}" y="${cy+R+40}" font-size="10" fill="var(--muted)" text-anchor="middle">刻度：中心 75% → 外圈 100%</text>
  </svg>`;
}

/* ---------- render one survey pane ---------- */
function renderPane(key){
  const d = DATA[key];
  const rr = key==='pgy' ? d.stu_rr : d.tea_rr;
  const respondents = rr._total.got;
  const kpis = `<div class="kpis">
     <div class="card kpi hl"><div class="n">${pct(d.overall)}</div><div class="k">總體滿意度</div></div>
     <div class="card kpi"><div class="n">${pct(rr._total.rate)}</div><div class="k">回收率</div></div>
     <div class="card kpi"><div class="n">${rr._total.got}<span style="font-size:1rem;color:var(--muted)">/${rr._total.req}</span></div><div class="k">填答 / 應填人數</div></div>
     <div class="card kpi"><div class="n">${d.questions.length}</div><div class="k">題項數</div></div>
   </div>`;

  const dimBand = d.dims.map(dm=>`<div class="dim">
     <div class="top"><span>${dm.name}</span><span>${pct(dm.sat)}</span></div>
     <div class="track"><div class="fill" style="width:${dm.sat*100}%"></div><div class="thrline"></div></div>
   </div>`).join('');

  const radar = `<div class="card panel"><h4>各構面滿意度 · 雷達圖</h4>${radarSVG(d.dims)}</div>`;
  const bandPanel = `<div class="card panel"><h4>各構面滿意度（紅線為 80% 門檻）</h4>${dimBand}</div>`;

  const legend = `<div class="legend">
    <span><i style="background:var(--vs)"></i>非常滿意</span>
    <span><i style="background:var(--s)"></i>滿意</span>
    <span><i style="background:var(--ok)"></i>尚可</span>
    <span><i style="background:var(--ns)"></i>不滿意</span>
    <span><i style="background:var(--vns)"></i>非常不滿意</span></div>`;

  const qlist = d.questions.map((q,i)=>{
    const tot=q.total||1;
    const seg=[q.vs,q.s,q.ok,q.ns,q.vns].map((c,j)=>
      `<span style="width:${c/tot*100}%;background:${clr[j]}"></span>`).join('');
    const low = q.sat<0.8;
    return `<div class="q">
      <div class="qtop"><span class="qtxt">${i+1}. ${q.q}</span>
        <span class="qsat" style="color:${low?'var(--fail)':'var(--vs)'}">${pct(q.sat)}</span></div>
      <div class="stack">${seg}</div></div>`;
  }).join('');
  const qPanel = `<div class="card panel"><h4>逐題滿意度與作答分布</h4>${legend}${qlist}</div>`;

  // job categories
  const jcats = Object.entries(rr).filter(([k,v])=>k!=='_total' && typeof v.req==='number')
    .map(([k,v])=>({name:k, req:v.req, got:(typeof v.got==='number'?v.got:0),
                    rate:(typeof v.rate==='number'?v.rate:0)}));
  const jc = jcats.map(o=>{
    const pass=o.rate>=RR_THR;
    return `<div class="jc"><div class="jtop">
       <span class="jname">${o.name} <span style="color:var(--muted);font-weight:400">(${o.got}/${o.req})</span></span>
       <span class="jrate" style="color:${pass?'var(--vs)':'var(--fail)'}">${pct(o.rate)}</span></div>
       <div class="track"><div class="fill" style="width:${o.rate*100}%;background:${pass?'var(--vs)':'var(--ns)'}"></div><div class="thrline"></div></div>
     </div>`;}).join('');
  const jcTotal = `<div class="jc" style="margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)">
     <div class="jtop"><span class="jname" style="font-weight:800">合計</span>
       <span class="jrate" style="color:${rr._total.rate>=RR_THR?'var(--vs)':'var(--fail)'}">${pct(rr._total.rate)} (${rr._total.got}/${rr._total.req})</span></div></div>`;
  const jcPanel = `<div class="card panel"><h4>各職類填答分布（灰線為 70% 門檻）</h4>${jc}${jcTotal}</div>`;

  // 需關注題項（滿意度最低 3 題）
  const low3 = [...d.questions].sort((a,b)=>a.sat-b.sat).slice(0,3);
  const attColor = v => v<0.8 ? 'var(--fail)' : (v<0.9 ? '#c9820a' : 'var(--vs)');
  const attBg   = v => v<0.8 ? 'var(--failbg)' : (v<0.9 ? '#fbeecb' : 'var(--passbg)');
  const attention = `<div class="attention">
     <h4>需關注題項（滿意度最低 3 題）</h4>
     ${low3.map(q=>`<div class="att-row">
        <span class="pctb" style="color:${attColor(q.sat)};background:${attBg(q.sat)}">${pct(q.sat)}</span>
        <span class="qn">${q.q}</span></div>`).join('')}
   </div>`;

  // 質性意見（僅有文字建議欄時；資料驅動，明年有內容自動列出）
  let qual = '';
  const raw = d.raw, tIdx = raw.cols.findIndex(c=>c.kind==='text');
  if(tIdx>=0){
    const cIdx = raw.cols.findIndex(c=>c.kind==='cat');
    const skip = new Set(['','無','沒有','沒','無。','無意見','n/a','na','none','.','。','-','－']);
    const items = raw.rows.map(r=>({who:cIdx>=0?(r[cIdx]||''):'', t:String(r[tIdx]||'').trim()}))
       .filter(o=>{
         const tt=o.t.toLowerCase();
         if(skip.has(tt)) return false;
         // 去除純標點／純表情：至少要有 2 個中日文字或英數
         const real=(o.t.match(/[\u4e00-\u9fffA-Za-z0-9]/g)||[]).length;
         return real>=2;
       });
    const body = items.length
      ? items.map(o=>`<div class="qitem"><span class="who">${o.who}</span>${o.t.replace(/</g,'&lt;')}</div>`).join('')
      : `<div class="empty">本年度學員未填寫實質文字建議（作答皆為「無／沒有」）。若日後有具體建議，此區會自動列出。</div>`;
    qual = `<div class="card panel qual" style="margin-top:18px">
       <h4>學員文字建議（質性意見）</h4>${body}</div>`;
  }

  return kpis + attention
    + `<div class="two" style="margin-top:18px">${radar}${bandPanel}</div>`
    + `<div class="two" style="margin-top:18px">${qPanel}${jcPanel}</div>`
    + qual;
}

/* ---------- detail (raw form responses) ---------- */
const LK = { // value -> {bg,fg,txt}
  5:{bg:'rgba(31,157,97,.88)',fg:'#fff',t:'非常滿意'},
  4:{bg:'rgba(131,201,141,.55)',fg:'#173d24',t:'滿意'},
  3:{bg:'rgba(243,193,75,.55)',fg:'#5a4708',t:'尚可'},
  2:{bg:'rgba(236,138,86,.62)',fg:'#5a2c10',t:'不滿意'},
  1:{bg:'rgba(217,83,79,.88)',fg:'#fff',t:'非常不滿意'},
};
function renderDetail(key){
  const raw = DATA[key].raw;
  const cols = raw.cols;
  const catIdx = cols.findIndex(c=>c.kind==='cat');
  const head = '<tr><th class="sticky">序</th>' + cols.map(c=>
      `<th data-full="${c.full.replace(/"/g,'&quot;')}">${c.lbl}</th>`).join('') + '</tr>';
  const body = raw.rows.map((row,ri)=>{
    let tds = `<td class="sticky">${ri+1}</td>`;
    row.forEach((v,ci)=>{
      const kind = cols[ci].kind;
      if(kind==='likert' && LK[v]){
        const m=LK[v];
        tds += `<td class="cell" style="background:${m.bg};color:${m.fg}" data-full="${m.t}">${v}</td>`;
      } else if(kind==='time'){
        tds += `<td class="timecol">${v||''}</td>`;
      } else if(kind==='cat'){
        tds += `<td class="catcol">${v||''}</td>`;
      } else if(kind==='text'){
        tds += `<td class="textcol">${(v||'').replace(/</g,'&lt;')||'—'}</td>`;
      } else {
        tds += `<td>${v===''||v==null?'—':v}</td>`;
      }
    });
    const catVal = catIdx>=0 ? (row[catIdx]||'') : '';
    return `<tr data-cat="${String(catVal).replace(/"/g,'&quot;')}">${tds}</tr>`;
  }).join('');
  const legend = `<div class="detail-legend">作答對照：
    ${[5,4,3,2,1].map(n=>`<span><i style="background:${LK[n].bg};color:${LK[n].fg}">${n}</i>${LK[n].t}</span>`).join('')}
  </div>`;
  const rr = key==='pgy' ? DATA.pgy.stu_rr : DATA.tea.tea_rr;
  const cats = Object.entries(rr).filter(([k,v])=>k!=='_total' && typeof v.req==='number')
     .map(([k,v])=>({name:k, req:v.req, got:(typeof v.got==='number'?v.got:0)}));
  const allChip = `<span class="chip allc active" onclick="filterDetail('${key}','__all__',this)">全部　已填 <b>${rr._total.got}</b>／應填 ${rr._total.req}</span>`;
  const chips = allChip + cats.map(o=>{
     const low = o.req>0 && (o.got/o.req)<RR_THR;
     return `<span class="chip ${low?'low':''}" onclick="filterDetail('${key}','${o.name}',this)">${o.name}　已填 <b>${o.got}</b>／應填 ${o.req}</span>`;
  }).join('');
  const rrPass = rr._total.rate>=RR_THR;
  const summary = `<div class="detail-sum">
     <span class="big">應填 <b>${rr._total.req}</b> 人</span>
     <span class="big">已填 <b>${rr._total.got}</b> 人</span>
     <span class="big">回收率 <span class="rr" style="color:${rrPass?'var(--pass)':'var(--fail)'}">${pct(rr._total.rate)}</span>

   </div>
   <div class="cat-chips">${chips}</div>`;
  return `<div class="card panel">
    <h4>${key==='pgy'?'受訓人員（PGY學員）':'教師'}問卷 · 表單回覆明細</h4>

  </div>`;
}

function filterDetail(key, cat, chipEl){
  const tbl = document.getElementById('detailtbl-'+key);
  const rows = tbl.tBodies[0].rows;
  let shown = 0;
  for(const tr of rows){
    const match = (cat==='__all__') || (tr.getAttribute('data-cat')===cat);
    tr.style.display = match ? '' : 'none';
    if(match) shown++;
  }
  // active chip toggle within this pane
  const chips = chipEl.parentElement.querySelectorAll('.chip');
  chips.forEach(c=>c.classList.remove('active'));
  chipEl.classList.add('active');
  const label = cat==='__all__' ? '全部' : cat;
  document.getElementById('count-'+key).innerHTML = `目前顯示 <b>${shown}</b> 筆（${label}）`;
}

/* ---------- enlarged header tooltip ---------- */
(function(){
  const qtip=document.getElementById('qtip');
  function place(e){
    const pad=14; let x=e.clientX+pad, y=e.clientY+20;
    const w=qtip.offsetWidth, h=qtip.offsetHeight;
    if(x+w>window.innerWidth-8) x=window.innerWidth-8-w;
    if(y+h>window.innerHeight-8) y=e.clientY-10-h;
    if(x<8) x=8; if(y<8) y=8;
    qtip.style.left=x+'px'; qtip.style.top=y+'px';
  }
  document.addEventListener('mouseover',e=>{
    const el=e.target.closest('.detail-tbl [data-full]');
    if(!el) return;
    qtip.textContent=el.getAttribute('data-full');
    qtip.style.display='block';
    place(e);
  });
  document.addEventListener('mousemove',e=>{
    if(qtip.style.display==='block') place(e);
  });
  document.addEventListener('mouseout',e=>{
    if(e.target.closest('.detail-tbl [data-full]')) qtip.style.display='none';
  });
})();

function showTab(which){
  const map={stu:'tabStu',sturaw:'tabStuRaw',tea:'tabTea',tearaw:'tabTeaRaw',rule:'tabRule'};
  Object.keys(map).forEach(k=>{
    document.getElementById('pane-'+k).classList.toggle('hide', k!==which);
    document.getElementById(map[k]).classList.toggle('on', k===which);
  });
}
